<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Reset your password</title>
  </head>
  <body>
    <p>Hi {{ username }},</p>
    <p>We received a request to reset your password.</p>
    <p>Send this token with your new password to <code>POST {{ host }}api/auth/reset_password</code>:</p>
    <p><code>{{ token }}</code></p>
    <p>The token is valid for 1 hour. If you did not request a password reset, ignore this email.</p>
  </body>
</html>
